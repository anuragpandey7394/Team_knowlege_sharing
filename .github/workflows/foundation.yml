name: Foundation verification
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: tka
          POSTGRES_PASSWORD: tka_local_only
          POSTGRES_DB: tka_dev
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U tka -d tka_dev" --health-interval 2s --health-timeout 3s --health-retries 30
      mailpit:
        image: axllent/mailpit@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
        ports: ["1025:1025", "8025:8025"]
        options: --health-cmd "/mailpit readyz" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://tka:tka_local_only@127.0.0.1:55432/tka_dev
      TEST_DATABASE_URL: postgresql://tka:tka_local_only@127.0.0.1:55432/tka_test
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      AI_PROVIDER: disabled
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, verified upstream tag
        with:
          fetch-depth: 0 # Prior committed M04 schema is the forward-upgrade fixture.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7, verified upstream tag
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium and native browser dependencies
        run: npm run browser:install -- --with-deps
      - name: Prepare dedicated test database
        run: docker exec '${{ job.services.postgres.id }}' psql -U tka -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE tka_test'
      - run: npm run db:migrate
      - run: npm run db:seed
      - name: Verify foundation without cloud credentials
        env:
          TKA_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: npm run verify:foundation
