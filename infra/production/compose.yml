name: tka-production
services:
  postgres:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: tka_owner
      POSTGRES_DB: tka_prod
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Inject a unique app-role password}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Inject a unique database password}
    volumes:
      [
        postgres-data:/var/lib/postgresql/data,
        "./init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro",
      ]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U tka_owner -d tka_prod"]
      interval: 2s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 2s
      timeout: 3s
      retries: 30
  migration:
    build:
      {
        context: ../..,
        dockerfile: infra/production/Dockerfile,
        target: migration,
      }
    environment:
      DATABASE_URL: postgresql://tka_owner:${POSTGRES_PASSWORD}@postgres:5432/tka_prod
    depends_on: { postgres: { condition: service_healthy } }
  api:
    build:
      { context: ../.., dockerfile: infra/production/Dockerfile, target: api }
    init: true
    environment: &application
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3001
      DATABASE_URL: postgresql://tka_app:${APP_DATABASE_PASSWORD}@postgres:5432/tka_prod
      TEST_DATABASE_URL: postgresql://tka_app:${APP_DATABASE_PASSWORD}@postgres:5432/tka_test
      WEB_ORIGIN: ${WEB_ORIGIN:?HTTPS origin required}
      CSRF_SECRET: ${CSRF_SECRET:?Inject a unique CSRF secret}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      AI_PROVIDER: disabled
    depends_on:
      migration: { condition: service_completed_successfully }
      mailpit: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
  worker:
    build:
      { context: ../.., dockerfile: infra/production/Dockerfile, target: api }
    init: true
    environment: *application
    command: [node, apps/api/dist/worker.js]
    depends_on: { api: { condition: service_healthy } }
  web:
    user: "${TKA_WEB_UID:-1000}:${TKA_WEB_GID:-1000}"
    build:
      { context: ../.., dockerfile: infra/production/Dockerfile, target: web }
    ports: ["${TKA_BIND_ADDRESS:-127.0.0.1}:${TKA_HTTPS_PORT:-8443}:8443"]
    volumes:
      ["${TKA_TLS_DIRECTORY:?TLS certificate directory required}:/run/tls:ro"]
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test:
        [
          CMD,
          curl,
          --fail,
          --silent,
          --cacert,
          /run/tls/cert.pem,
          --resolve,
          "${TKA_TLS_HOSTNAME:-localhost}:8443:127.0.0.1",
          "https://${TKA_TLS_HOSTNAME:-localhost}:8443/health/ready",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
